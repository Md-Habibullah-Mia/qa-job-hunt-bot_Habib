name: 🤖 Daily QA Job Hunt

on:
  schedule:
    - cron: '0 3 * * *'   # 9:00 AM Bangladesh time
  workflow_dispatch:

env:
  TZ: Asia/Dhaka

permissions:
  contents: write

jobs:
  job-hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Python packages
        run: pip install -r requirements.txt

      - name: 🌐 Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: ⚙️ Create config.json from secrets
        run: |
          mkdir -p config
          cat > config/config.json << 'EOF'
          {
            "api_keys": {
              "gemini_api_key": "${{ secrets.GEMINI_API_KEY }}",
              "apify_api_key": ""
            },
            "email": {
              "sender_email": "${{ secrets.GMAIL_ADDRESS }}",
              "sender_app_password": "${{ secrets.GMAIL_APP_PASSWORD }}",
              "recipient_email": "${{ secrets.GMAIL_ADDRESS }}",
              "report_time_ist": "09:00"
            },
            "linkedin": {
              "email": "${{ secrets.LINKEDIN_EMAIL }}",
              "password": "${{ secrets.LINKEDIN_PASSWORD }}",
              "auto_apply": false,
              "max_apply_per_day": 0
            },
            "job_preferences": {
              "role_titles": [
                "QA Automation Engineer",
                "Software Test Engineer",
                "SDET",
                "Test Automation Engineer",
                "QA Engineer",
                "Quality Assurance Engineer",
                "Automation Test Lead",
                "Senior QA Engineer"
              ],
              "experience_years": 5,
              "min_match_score": 0,
              "excluded_keywords": ["unpaid", "internship", "fresher only"],
              "preferred_salary_usd_min": 30000
            },
            "search_settings": {
              "max_jobs_per_source": 50,
              "days_old_max": 3,
              "dedup_window_days": 14
            },
            "direct_apply": {
              "enabled": true,
              "dry_run": true,
              "min_match_score": 70,
              "max_per_day": 10
            },
            "resume_path": "config/resume.pdf"
          }
          EOF

      - name: 📄 Create resume profile
        env:
          RESUME_PROFILE_JSON: ${{ secrets.RESUME_PROFILE_JSON }}
        run: |
          mkdir -p config
          printf '%s' "$RESUME_PROFILE_JSON" > config/resume_profile.json
          python3 -m json.tool config/resume_profile.json > /dev/null
          echo "✅ Resume profile created and validated successfully"

      - name: 📄 Create resume PDF (for auto-apply attachments)
        env:
          RESUME_PDF_BASE64: ${{ secrets.RESUME_PDF_BASE64 }}
        run: |
          mkdir -p config
          if [ -n "$RESUME_PDF_BASE64" ]; then
            echo "$RESUME_PDF_BASE64" | base64 -d > config/resume.pdf
            echo "✅ Resume PDF decoded ($(wc -c < config/resume.pdf) bytes)"
          else
            echo "⚠️ RESUME_PDF_BASE64 secret not set — applications will be submitted without an attached resume."
          fi

      - name: 📁 Create folders
        run: mkdir -p logs data docs

      # jobs_db.json / applied_jobs.json are gitignored, so without this every
      # run starts empty: dedup never kicks in and jobs get re-applied.
      - name: 🗄️ Restore job history
        uses: actions/cache@v4
        with:
          path: |
            data/jobs_db.json
            data/applied_jobs.json
          key: job-history-${{ github.run_id }}
          restore-keys: job-history-

      - name: 🚀 Run Job Hunt Pipeline
        run: python main.py --resume-path config/resume.pdf
        env:
          PYTHONUNBUFFERED: 1
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}

      - name: 💾 Verify dashboard data
        if: always()
        run: |
          echo "=== Checking docs folder ==="
          ls -la docs/ || echo "docs folder empty"
          if [ -f docs/jobs.enc.json ]; then
            echo "🔐 jobs.enc.json: $(wc -c < docs/jobs.enc.json) bytes (encrypted)"
          elif [ -f docs/jobs.json ]; then
            SIZE=$(wc -c < docs/jobs.json)
            JOBS=$(python3 -c "import json; d=json.load(open('docs/jobs.json')); print(d.get('total_matched',0))")
            echo "✅ jobs.json: $SIZE bytes, $JOBS jobs"
          else
            echo "⚠️ jobs.json missing — creating placeholder"
            mkdir -p docs
            python3 -c "
          import json, datetime
          json.dump({'generated_at': datetime.datetime.now().isoformat(),'total_scraped':0,'total_matched':0,'jobs':[],'stats':{'excellent':0,'good':0,'bangladesh_remote':0,'sponsorship':0,'remote_worldwide':0}}, open('docs/jobs.json','w'))
          print('placeholder created')
          "
          fi

      - name: 📊 Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-report-${{ github.run_number }}
          path: logs/report_*.html
          retention-days: 30

      - name: 🌐 Push dashboard to GitHub
        if: always()
        run: |
          git config user.name "QA Job Bot"
          git config user.email "qa-bot@users.noreply.github.com"

          # Encrypted (jobs.enc.json) when DASHBOARD_PASSWORD is set, else plain jobs.json
          DATA=jobs.json
          [ -f docs/jobs.enc.json ] && DATA=jobs.enc.json

          echo "💾 Saving generated dashboard ($DATA)..."
          cp docs/$DATA /tmp/$DATA

          echo "🧹 Removing generated working-tree files..."
          git checkout -- docs/ 2>/dev/null || true
          rm -f docs/jobs.enc.json

          echo "🔄 Fetching latest main..."
          git fetch origin main

          echo "📌 Checking out latest main..."
          git checkout -B main origin/main

          echo "📊 Restoring generated dashboard..."
          cp /tmp/$DATA docs/$DATA
          if [ "$DATA" = "jobs.enc.json" ] && git ls-files --error-unmatch docs/jobs.json >/dev/null 2>&1; then
            echo "🔐 Removing public plain jobs.json"
            git rm -q docs/jobs.json
          fi

          git add -f docs/$DATA

          if git diff --cached --quiet; then
            echo "ℹ️ No changes"
          else
            git commit -m "📊 Daily jobs $(date '+%Y-%m-%d') [skip ci]"

            echo "🚀 Pushing dashboard to main..."
            git push origin main

            echo "✅ Dashboard updated!"
          fi
